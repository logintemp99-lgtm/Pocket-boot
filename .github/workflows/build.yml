name: Build Android APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "8.9"

      # Finds the Android project wherever it lives in the repository:
      #  1. any folder with settings.gradle(.kts) that contains an Android app module (shallowest first)
      #  2. if none, any .zip file in the repo that contains such a project (it gets unzipped)
      - name: Find the Android project
        id: find
        shell: bash
        run: |
          set -euo pipefail

          find_project() {
            local root="$1" settings dir
            while IFS= read -r settings; do
              dir="$(dirname "$settings")"
              if grep -rqE 'com\.android\.application' --include='build.gradle' --include='build.gradle.kts' "$dir"; then
                echo "$dir"
                return 0
              fi
            done < <(find "$root" -type f \( -name 'settings.gradle' -o -name 'settings.gradle.kts' \) -not -path '*/.git/*' \
                      | awk '{ print gsub("/","/") " " $0 }' | sort -n | cut -d' ' -f2-)
            return 1
          }

          PROJECT_DIR="$(find_project . || true)"

          if [ -z "$PROJECT_DIR" ]; then
            echo "No Gradle project found in the repository files. Looking inside .zip files..."
            while IFS= read -r zipfile; do
              out="$RUNNER_TEMP/unzipped/$(basename "$zipfile" .zip)"
              mkdir -p "$out"
              unzip -q -o "$zipfile" -d "$out" || continue
              PROJECT_DIR="$(find_project "$out" || true)"
              if [ -n "$PROJECT_DIR" ]; then
                echo "Found a project inside $zipfile"
                break
              fi
            done < <(find . -type f -iname '*.zip' -not -path './.git/*')
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "::error::Could not find an Android project (a settings.gradle[.kts] next to a module that uses com.android.application)."
            find . -maxdepth 3 -not -path './.git/*' | head -n 100
            exit 1
          fi

          PROJECT_DIR="$(cd "$PROJECT_DIR" && pwd)"
          echo "Using project at: $PROJECT_DIR"
          echo "dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"

      - name: Build debug APK
        working-directory: ${{ steps.find.outputs.dir }}
        shell: bash
        run: |
          if [ -f gradlew ] && [ -f gradle/wrapper/gradle-wrapper.jar ]; then
            chmod +x gradlew
            ./gradlew --no-daemon assembleDebug
          else
            gradle --no-daemon assembleDebug
          fi

      - name: Collect APK
        shell: bash
        run: |
          APK="$(find "${{ steps.find.outputs.dir }}" -path '*/build/outputs/apk/debug/*.apk' | head -n 1)"
          if [ -z "$APK" ]; then
            echo "::error::APK not found after build"
            exit 1
          fi
          mkdir -p dist
          cp "$APK" dist/PocketBoot.apk
          ls -lh dist

      - name: Upload APK (Actions artifact)
        uses: actions/upload-artifact@v4
        with:
          name: PocketBoot-apk
          path: dist/PocketBoot.apk

      # Creates a Release with the APK attached, so you can download it straight on your phone
      # (Releases tab of your repository -> latest build -> PocketBoot.apk).
      - name: Publish release
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PocketBoot build ${{ github.run_number }}
          files: dist/PocketBoot.apk
